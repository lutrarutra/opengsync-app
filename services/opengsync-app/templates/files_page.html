{% from "components/spinner.jinja2" import spinner %}
{% extends "base.html" %}
{% set active_page = "browser-page" %}
{% block content %}
<div class="file-browser" id="file-browser-container">
    <div class="file-browser-toolbar" role="toolbar" aria-label="File browser sorting">
        <span class="file-browser-toolbar-label">Sort by:</span>
        <button
            type="button"
            class="btn btn-sm {% if sort_by == 'name' %}btn-primary{% else %}btn-outline-primary{% endif %}"
            hx-get="{{ url_for('shared_browser_entries' if share_token else 'render_file_browser_page', token=share_token, subpath='', page=0, sort_by='name', sort_order='asc') }}"
            hx-target="#file-browser-root"
            hx-swap="innerHTML"
            hx-indicator="#file-browser-root-loading">
            <i class="bi bi-sort-alpha-down" aria-hidden="true"></i>
            Filename
        </button>
        <button
            type="button"
            class="btn btn-sm {% if sort_by == 'mtime' %}btn-primary{% else %}btn-outline-primary{% endif %}"
            hx-get="{{ url_for('shared_browser_entries' if share_token else 'render_file_browser_page', token=share_token, subpath='', page=0, sort_by='mtime', sort_order='desc') }}"
            hx-target="#file-browser-root"
            hx-swap="innerHTML"
            hx-indicator="#file-browser-root-loading">
            <i class="bi bi-clock-history" aria-hidden="true"></i>
            Edited
        </button>
        <button
            type="button"
            class="btn btn-sm {% if sort_by == 'size' %}btn-primary{% else %}btn-outline-primary{% endif %}"
            hx-get="{{ url_for('shared_browser_entries' if share_token else 'render_file_browser_page', token=share_token, subpath='', page=0, sort_by='size', sort_order='desc') }}"
            hx-target="#file-browser-root"
            hx-swap="innerHTML"
            hx-indicator="#file-browser-root-loading">
            <i class="bi bi-sort-numeric-down" aria-hidden="true"></i>
            Size
        </button>
        <span class="file-browser-root-loading htmx-indicator" id="file-browser-root-loading">
            {{ spinner() }}
        </span>
    </div>

    <div class="file-browser-storage-status">
        <span>Storage status:</span>
        <strong id="mount-status-badge">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span class="visually-hidden">Loading...</span>
        </strong>
        <small id="mount-status-details"></small>
    </div>

    <div
        class="file-browser-root"
        id="file-browser-root"
        hx-get="{{ url_for('shared_browser_entries' if share_token else 'render_file_browser_page', token=share_token, subpath='', page=0, sort_by=sort_by, sort_order=sort_order) }}"
        hx-trigger="load"
        hx-swap="innerHTML">
        <div class="browser-loading-initial">
            {{ spinner() }}
            <span>Loading files…</span>
        </div>
    </div>
</div>

<script>
function toggleBrowserDirectory(toggle) {
    const directory = toggle.closest('.browser-directory');
    if (!directory) return;

    const expanded = directory.classList.toggle('is-expanded');
    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
}

$(document).ready(function() {
    function renderStatus(data) {
        const badge = $("#mount-status-badge");
        const details = $("#mount-status-details");
        details.text("");

        if (data.status === "online") {
            badge.text("🟢 Online");
        } else if (data.status === "degraded") {
            badge.text("🟠 Degraded");
            const offlineMounts = [];
            for (const [name, statusMessage] of Object.entries(data.details)) {
                if (statusMessage !== "online") offlineMounts.push(name);
            }
            details.text("Missing: " + offlineMounts.join(", "));
        } else if (data.status === "offline") {
            badge.text("🔴 Offline");
            details.text("Cannot connect to cluster storage.");
        } else {
            badge.text("⚫ Unknown");
            details.text("Share status is not configured.");
        }
    }

    $.ajax({
        url: "{{ url_for('share_status_check') }}",
        type: "GET",
        dataType: "json",
        success: renderStatus,
        error: function(jqXHR) {
            if (jqXHR.responseJSON) {
                renderStatus(jqXHR.responseJSON);
            } else {
                $("#mount-status-badge").text("⚫ Unknown Error");
                $("#mount-status-details").text("Failed to reach server API.");
            }
        }
    });
});
</script>
{% endblock content %}
