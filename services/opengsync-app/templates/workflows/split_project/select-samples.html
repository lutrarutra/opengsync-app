<div id="split-project-select-samples-container" class="modal-content">
    <div class="modal-header">
        <h1 class="modal-title fs-5">Split Project: Select Samples</h1>
        <button type="button" class="btn-close modal-close-btn-confirm" aria-label="Close" onclick="confirm_close_modal('#fullscreen-modal')"></button>
    </div>
    <div class="modal-body">
        {{ form.render_general_errors() }}
        {{ form.selected_sample_ids.render() }}
        <hr>
        <h5>Selected Samples ({{ form.selected_sample_ids.data | length }})</h5>
        {{ form.selected_sample_ids.render_selected_table() }}
        {{ form.csrf_token.render() }}
    </div>
    <div class="modal-footer">
        <div class="footer-controls">
            <button type="button" class="btn btn-primary"
                hx-target="#split-project-select-samples-container" hx-swap="outerHTML"
                hx-include="#split-project-select-samples-container"
                hx-post="{{ form.post_url }}">
                Next
            </button>
        </div>
    </div>
</div>
