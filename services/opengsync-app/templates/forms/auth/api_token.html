<div class="modal-content" id="api_token-form-container">
    <div class="modal-header">
        <h1 class="modal-title fs-5" >Create API Token</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div id="api_token-form">
            {{ form.csrf_token.render() }}
            {{ form.time_valid_min.render() }}
        </div>
    </div>
    <div class="modal-footer" id="popup-footer">
        <div class="footer-id">
        </div>
        <div class="footer-info">
        </div>
        <div class="footer-controls">
            <button id="submit-api_token-btn" class="btn btn-success"
            hx-include="#api_token-form" hx-target="#api_token-form-container" hx-swap="outerHTML"
            hx-post="{{ form.post_url }}">Create</button>
        </div>
    </div>
</div>
