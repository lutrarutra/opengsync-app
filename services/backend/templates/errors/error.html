<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
        <link rel="icon" href="{{ url_for('static', filename='images/logo/opengsync_128.png') }}" sizes="128x128" type="image/png">
        <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo/apple-touch-icon.png') }}">

        <title>OpeNGSync</title>
        <!-- Custom CSS --> 
        <link href="{{ url_for('static', filename='style/compiled/style.css') }}" rel="stylesheet" type="text/css"> 
        
        <!-- jQuery -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

        <!-- Sweet Alert 2 -->
        <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4@4/bootstrap-4.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>

    <body>
        <h2 style="padding-left: 10px; margin: 0;">{{ msg }} ({{ code }})</h2>
        <script>

            function showOneFlashFromList(messages, index) {
                if (index >= messages.length) {
                    return;
                }
                const msg = messages[index];
                // Render as text: messages can contain user-controlled names
                const content = document.createElement('div');
                content.style.cssText = 'display: flex; justify-content: center; align-items: center; height: 100%; padding: 0; font-weight: 600;';
                content.textContent = msg.message;
                Swal.fire({
                    position: 'top',
                    icon: msg.category || 'success',
                    html: content,
                    showConfirmButton: false,
                    timer: msg.category === 'error' ? null : 1000,
                    toast: true,
                    showCloseButton: true,
                    willClose: function() {
                        showOneFlashFromList(messages, index + 1);
                    }
                });
            }
        </script>
    </body>
</html>
