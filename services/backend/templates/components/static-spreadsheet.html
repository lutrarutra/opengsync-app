{# Unique per render: htmx settles elements whose id is in the old and the new content by resetting their class after the scripts ran, which would drop the classes jspreadsheet adds #}
{% set grid_id = spreadsheet._id ~ "-" ~ uuid4().hex %}
<div class="spreadsheet-container" {% if height is defined and height %}style="height: {{ height }}; flex: none;"{% endif %}>
    <div id="{{ grid_id }}" class="spreadsheet-grid">
    </div>
</div>
<script>
    $(document).ready(function() {
        // TODO: This is a temporary fix to allow the spreadsheet to load on staging (v2)
        load_jspreadsheet("{{ url_for('static', filename='js/jss-extended.js') }}").then(() => {
            window.jspreadsheet(document.getElementById("{{ grid_id }}"), {
                worksheets: [{
                    data: {{ spreadsheet._data | tojson }},
                    columns: [
                        {% for col in spreadsheet.columns %}
                        {%- if col.type == "text" or col.type == "numeric" -%}
                        { type: "{{col.type}}", title: "{{col.name}}", width: {{ col.width }} },
                        {%- elif col["type"] == "dropdown" -%}
                        { type: "{{col.type}}", title: "{{col.name}}", width: {{ col.width }}, source: {{ col.source | tojson }}, autocomplete: true, options: { newOptions: true } },
                        {%- endif -%}
                        {% endfor %}
                    ],
                    allowInsertRow: false,
                    allowManualInsertRow: false,
                    allowDeleteRow: false,
                    allowDeleteColumn: false,
                    allowInsertColumn: false,
                    allowRenameColumn: false,
                    editable: false,
                    tableOverflow: true,
                    tableWidth: "100%",
                    stretchColumns: true,
                    stickyIndex: true,
                    tableHeight: "100%",
                    style: {{ spreadsheet.style | tojson }},
                }],
            });
        });
    });
</script>
