{% from "components/contextmenu.jinja2" import context_menu %}
{% for sequencer in rows %}
<tr>
    <th scope="row">{{ sequencer.id }}</th>
    <td class="cm-callback" {{
        context_menu([
            {"type": "copy", "value": sequencer.name, "label": "Copy Name"},
        ])
    }}><a href="{{ url_for('sequencer_page', sequencer_id=sequencer.id) }}">{{ sequencer.name }}</a></td>
    <td>{{ sequencer.model.display_name }}</td>
</tr>
{% endfor %}
