{% from "components/contextmenu.jinja2" import context_menu %}
{% for kit in rows %}
<tr>
    <th scope="row">{{ kit.id }}</th>
    <td class="cm-callback" {{
        context_menu([
            {"type": "copy", "value": kit.identifier, "label": "Copy Identifier"},
        ])
    }}><a 
        {% if kit.kit_type == C.KitType.INDEX_KIT %}
        href="{{ url_for('index_kit_page', index_kit_id=kit.id) }}"
        {% elif kit.kit_type == C.KitType.FEATURE_KIT %}
        href="{{ url_for('feature_kit_page', feature_kit_id=kit.id) }}"
        {% else %}
        href="{{ url_for('kit_page', kit_id=kit.id) }}"
        {% endif %}>{{ kit.identifier }}</a>
    </td>
    <td class="cm-callback" {{
        context_menu([
            {"type": "copy", "value": kit.name, "label": "Copy Name"},
        ])
    }}><a 
        {% if kit.kit_type == C.KitType.INDEX_KIT %}
        href="{{ url_for('index_kit_page', index_kit_id=kit.id) }}"
        {% elif kit.kit_type == C.KitType.FEATURE_KIT %}
        href="{{ url_for('feature_kit_page', feature_kit_id=kit.id) }}"
        {% else %}
        href="{{ url_for('kit_page', kit_id=kit.id) }}"
        {% endif %}>{{ kit.name }}</a>
    </td>
    <td>{{ kit.kit_type.label }}</td>
</tr>
{% endfor %}
