{#- toolbar buttons of the assignees table (Variant.toolbar) -#}
{% from "components/tooltip.jinja2" import tooltip %}
<span {% if not current_user.is_insider %}{{ tooltip("Only insiders can add assignees.", "left", "warning") }}{% endif %}>
    <button type="button" class="otable-btn otable-btn-primary" hx-get="{{ url_for('AddProjectAssigneeAction.Begin', project_id=project.id) }}"
        data-bs-toggle="modal" data-bs-target="#xl-modal" hx-target="#xl-modal-content" hx-swap="innerHTML" hx-trigger="click"
        {% if not current_user.is_insider %}disabled{% endif %}>
        <i class="bi bi-person-plus" aria-hidden="true"></i> Add Assignee
    </button>
</span>
