{% extends "base.html" %}
{% set active_page = "kits-page" %}
{% block content %}
<div class="page-header-container">
    <div class="page-header">
        <div class="page-title">
            <h1>Kits</h1>
        </div>
        <div class="page-controls">
            {% if current_user.is_admin %}
            <button type="button" class="btn btn-primary"  data-bs-toggle="modal" data-bs-target="#xl-modal" 
                hx-get="{{ url_for('KitForm.Create') }}"
                hx-target="#xl-modal-content" data-bs-toggle="modal" hx-swap="innerHTML">
                New Kit
            </button>
            {% endif %}
        </div>
    </div>
</div>

<div class="page-content">
    <div hx-get="{{ url_for('render_kit_table') }}" hx-trigger="load" hx-swap="outerHTML">
        {{ spinner() }}
    </div>
</div>
{% endblock content %}
