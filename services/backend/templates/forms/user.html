<div class="modal-content" id="user-form-container">
    <div class="modal-header">
        <h1 class="modal-title fs-5" >Edit User</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div id="user-form">
            {{ form.csrf_token.render() }}
            {{ form.role.render() }}
            <div class="row">
                {{ form.first_name.render("col-6") }}
                {{ form.last_name.render("col-6") }}
            </div>
        </div>
    </div>
    <div class="modal-footer" id="popup-footer">
        <div class="footer-controls">
            <button id="submit-user-btn" class="btn btn-success"
            hx-include="#user-form" hx-target="#user-form-container" hx-swap="outerHTML"
            hx-post="{{ form.post_url }}">Save</button>
        </div>
    </div>
</div>
