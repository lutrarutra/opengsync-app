<div id="reset_password-form">
    {{ form.csrf_token.render() }}
    {{ form.email.render() }}

    <div class="row">
        {{ form.password.render("col") }}
        {{ form.confirm.render("col") }}
    </div>
    <button type="button" class="btn btn-success"
    hx-include="#reset_password-form" hx-target="#reset_password-form" hx-swap="outerHTML"
    hx-post="{{ form.post_url }}">Submit</button>
</div>
