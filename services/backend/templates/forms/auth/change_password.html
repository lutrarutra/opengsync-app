<div class="modal-content" id="change-password-form">
    <div class="modal-header">
        <h1 class="modal-title fs-5" >Change Password</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <form>
            {{ form.csrf_token.render() }}
            {{ form.current_password.render() }}
            <div class="row">
                {{ form.new_password.render("col-6") }}
                {{ form.confirm_new_password.render("col-6") }}
            </div>
        </form>
    </div>
    <div class="modal-footer" id="popup-footer">
        <button type="button" class="btn btn-success"
        hx-include="#change-password-form" hx-target="#change-password-form" hx-swap="outerHTML"
        hx-post="{{ form.post_url }}">Submit</button>
    </div>
</div>
