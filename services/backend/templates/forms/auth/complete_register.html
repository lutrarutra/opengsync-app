<div id="complete-register-form-container">
    <div id="complete-register-form">
        {{ form.csrf_token.render() }}
        <div class="row">
            {{ form.email.render("col-4") }}
            {{ form.first_name.render("col-4") }}
            {{ form.last_name.render("col-4") }}
        </div>
        <div class="row">
            {{ form.password.render("col-6") }}
            {{ form.confirm.render("col-6") }}
        </div>
        <h3>Organization & Principal Investigator</h3>
        {% include "forms/user-profile-fields.html" %}
    </div>
    <button id="submit-complete-register-btn" class="btn btn-success"
    hx-include="#complete-register-form" hx-target="#complete-register-form-container" hx-swap="outerHTML"
    hx-post="{{ form.post_url }}">Register</button>
</div>
