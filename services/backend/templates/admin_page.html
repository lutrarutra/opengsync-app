{% extends "base.html" %}
{% set active_page = "admin-page" %}
{% block content %}
<div class="page-header-container">
    <div class="page-header">
        <div class="page-title">
            <h1>Admin</h1>
        </div>
        <div class="page-controls">
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('admin_shares_page') }}"><i class="bi bi-share"></i> Shares</a>
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('admin_audits_page') }}"><i class="bi bi-journal-text"></i> Audit Log</a>
        </div>
    </div>
</div>

<div class="page-content">
    <div hx-get="{{ url_for('admin_chat_usage') }}" hx-trigger="load" hx-swap="outerHTML">
        {{ spinner() }}
    </div>
    <div hx-get="{{ url_for('plots_api.weekday_usage') }}" hx-trigger="load" hx-swap="outerHTML">
        {{ spinner() }}
    </div>
</div>
{% endblock content %}
