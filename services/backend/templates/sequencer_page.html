{% extends "base.html" %}
{% set active_page = "sequencers-page" %}
{% block content %}
<div class="page-header-container">
    <div class="page-header">
        <div class="page-title">
            <h1>{{ sequencer.name }} <span class="desc">{{ sequencer.model.label }}</span></h1>
        </div>
        <div class="page-controls">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#xl-modal" 
                hx-get="{{ url_for('SequencerForm.Edit', sequencer_id=sequencer.id) }}"
                hx-target="#xl-modal-content" data-bs-toggle="modal"
                hx-swap="innerHTML" hx-trigger="click">
                Edit
            </button>
            <button type="button"class="btn btn-danger"
                hx-delete="{{ url_for('delete_sequencer', sequencer_id=sequencer.id) }}"
                _="on htmx:confirm(issueRequest)
                    halt the event
                    call Swal.fire({
                        title: 'Delete Sequencer \'{{ sequencer.name }}\'',
                        showDenyButton: true,
                        text: 'Do you want to proceed?',
                        confirmButtonText: 'Yes',
                        denyButtonText: 'No'
                    })
                    if result.isConfirmed issueRequest()">
                Delete
            </button>
        </div>
    </div>
</div>
{% endblock content %}
