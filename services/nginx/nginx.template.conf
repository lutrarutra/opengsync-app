# Share-link and WebDAV throttling (docs/file-share.md#load-and-throttling). Every downloaded file is a request
# the app checks on the share mount, and rclone sends up to 24 at once per user; requests above these rates
# wait in nginx (cheap) instead of piling up in the app. Only past `burst` waiting requests is one refused (429),
# which rclone retries. Non-share requests have an empty key and are not limited.
map $uri $share_token {
    "~^/api/(?:webdav|shares/(?:rclone|browse|zip))/(?<share_tok>[0-9A-Za-z-]{36})" $share_tok;
    "~^/files/share/browse/(?<share_tok>[0-9A-Za-z-]{36})" $share_tok;
    default "";
}
map $share_token $share_all {
    "" "";
    default "all";
}
limit_req_zone $share_token zone=share_per_token:10m rate=100r/s;
limit_req_zone $share_all zone=share_global:1m rate=300r/s;
limit_req_status 429;

upstream opengsync-app {
    server opengsync-app:5000;
}

# Uploaded media that can carry script is sandboxed: nginx does not pass the app's own
# Content-Security-Policy through an X-Accel-Redirect, so it is set again here.
map $uri $media_csp {
    ~*\.(html?|svg|xml)$ "sandbox";
    default "";
}


server {
    listen 80;
    client_max_body_size 20M;
    server_name my-personal-domain.com www.my-personal-domain.com;

    # Opt out of crawling (robots.txt) and indexing (X-Robots-Tag, also honoured for URLs
    # found via external links). Locations with their own add_header must repeat it.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://opengsync-app/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /;
        # tells the app that mod_zip is loaded, so it offers zip downloads; overwrites any client-sent value
        proxy_set_header X-Archive-Support zip;


        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header Overwrite $http_overwrite;
        proxy_set_header If $http_if;
        proxy_set_header Lock-Token $http_lock_token;
        proxy_set_header Timeout $http_timeout;

        proxy_redirect off;
    }

    # share links and WebDAV: as `location /`, plus the throttling above
    location ~ ^/(api/webdav|api/shares/rclone|api/shares/browse|files/share/browse)/ {
        limit_req zone=share_per_token burst=1000;
        limit_req zone=share_global burst=5000;
        proxy_pass http://opengsync-app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /;
        proxy_set_header X-Archive-Support zip;

        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header Overwrite $http_overwrite;
        proxy_set_header If $http_if;
        proxy_set_header Lock-Token $http_lock_token;
        proxy_set_header Timeout $http_timeout;

        proxy_redirect off;
    }

    # Share downloads as one zip: the app answers with a file list (X-Archive-Files: zip) and mod_zip
    # streams the files from /nginx-share/. Walking a large share over the network mount can take a while.
    location /api/shares/zip/ {
        proxy_pass http://opengsync-app/api/shares/zip/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /;
        proxy_set_header X-Archive-Support zip;
        limit_req zone=share_per_token burst=20;
        # mod_zip needs the file list to answer HEAD with the zip's Content-Length
        proxy_method GET;
        proxy_read_timeout 300s;
        proxy_redirect off;
    }

    location /static/ {
        alias /static/;
    }

    location /nginx-share/ {
        # important for security: only allow access to this location from the app, not directly from the outside world
        internal;  
        alias /share/;
        # can also be here, but usually set globally
        sendfile on;
        # Optional tuning:
        tcp_nopush on;
        tcp_nodelay on;

        # Buffer sizes (tweak based on your workload)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /nginx-media/ {
        internal;
        alias /media/;
        add_header Content-Security-Policy $media_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    error_page 502 503 504 /custom_50x.html;
    location = /custom_50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}