;; PgBouncer configuration for the paperplane production stack.
;;
;; Mounted read-only at /etc/pgbouncer/pgbouncer.ini. Contains no secrets:
;; the client userlist is rendered at startup from the environment by
;; ./pgbouncer-entrypoint.sh.
;;
;; This file is the tuning surface for connection pooling. Postgres runs with
;; max_connections = 100 (services/db/postgresql.prod.conf); the app talks to
;; Postgres only through this pooler, so the server-side connection count is
;; bounded by default_pool_size below rather than by Gunicorn worker count.

;; The [databases] section is generated at startup by pgbouncer-entrypoint.sh
;; from DB_HOST / DB_PORT, so the backend address follows POSTGRES_HOST /
;; POSTGRES_PORT instead of being duplicated here.

[pgbouncer]
user = postgres
listen_addr = 0.0.0.0
listen_port = 6432

;; Clients authenticate against a userlist rendered from POSTGRES_USER /
;; POSTGRES_PASSWORD at startup. Plain-text entries are valid for scram-sha-256.
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt

;; Who may read pool statistics on the console (the virtual database
;; `pgbouncer`). The console denies everyone by default, and pgbouncer_exporter
;; needs it to expose pgbouncer_pools_* metrics. This user has read-only console
;; access and does not need to exist in PostgreSQL.
;;
;; The placeholder is rendered at startup by pgbouncer-entrypoint.sh from
;; POSTGRES_MONITORING_USER, and that user is added to the userlist alongside
;; the application user. Do not delete the placeholder: the substitution is the
;; only way this value reaches the container without a secret in git.
stats_users = __PGBOUNCER_STATS_USERS__

;; Transaction pooling multiplexes many client connections onto a small server
;; pool, which is what keeps Postgres under max_connections no matter how many
;; Gunicorn workers or API replicas exist.
;;
;; Budget: default_pool_size is per user/database pair. One pooled user here,
;; so ~20 server connections from the API. Workers/scheduler connect through
;; this same pooler, so leave headroom below max_connections = 100.
pool_mode = transaction
default_pool_size = 20
max_client_conn = 200

;; Protocol-level named prepared statements (psycopg3 uses them by default) are
;; tracked and supported in transaction mode from PgBouncer 1.24 onward.
max_prepared_statements = 200

;; psycopg sends extra_float_digits during startup; let it through.
ignore_startup_parameters = extra_float_digits

;; Log to stderr so Docker captures it; keep runtime files off the read-only
;; config dir. The directory is created by pgbouncer-entrypoint.sh.
logfile =
pidfile = /tmp/pgbouncer/pgbouncer.pid
