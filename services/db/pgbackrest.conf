# pgBackRest configuration for the opengsync production cluster.
#
# Baked into the postgres image at /etc/pgbackrest/pgbackrest.conf.
#
# Two local (posix) repositories, both under the host directory
# PGBACKREST_REPO_DIR that compose bind-mounts at /var/lib/pgbackrest:
#
#   repo1 (pitr/)     weekly full backups + continuous WAL: point-in-time
#                     recovery to any moment in the last 31 days.
#   repo2 (monthly/)  one full backup per month, kept forever: snapshots of
#                     how the database looked at the start of each month.
#
# archive-push writes every WAL segment to both repositories, and
# pgbackrest-backup.sh decides which repository a backup goes to. Each repository
# is self-contained (backups + the WAL to make them consistent), so either is
# all a restore needs. Being on the same host as the cluster, they cover
# corruption, mistakes and bad migrations, but not the loss of the host (or of
# the disk, if it is the same one as PGDATA).
#
# Precedence: command line > environment > this file > default

[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest/pitr

# Time-based retention: keep every full backup from the last 31 days plus the
# newest one older than that, so any point in the last 31 days can be restored.
# WAL is expired together with the full backups that need it, which is why
# repo1-retention-archive is not set. (Note it counts backups, not days.)
repo1-retention-full-type=time
repo1-retention-full=31

repo2-type=posix
repo2-path=/var/lib/pgbackrest/monthly

# Never expire monthly backups (9999999 is the maximum count). Continuous WAL is
# kept only from the newest one, so older months restore to their snapshot
# (--type=immediate), not to arbitrary points in between. The WAL each backup
# needs to be consistent is always kept with it.
repo2-retention-full-type=count
repo2-retention-full=9999999
repo2-retention-archive-type=full
repo2-retention-archive=1

# Begin the backup with an immediate checkpoint instead of waiting up to
# checkpoint_timeout for the next scheduled one.
start-fast=y

# Archive pushes are latency-sensitive (PostgreSQL is waiting on them), so use a
# lighter compression level than backups. Must stay here: it is scoped to this
# command, and env is global.
[global:archive-push]
compress-level=3

[opengsync]
pg1-path=/var/lib/postgresql/data
# Fallback; compose sets PGBACKREST_PG1_PORT from POSTGRES_PORT (= PGPORT).
pg1-port=5432
# pg1-user is the cluster superuser, which is POSTGRES_USER (not `postgres`):
# compose sets PGBACKREST_PG1_USER. Both are set at container level rather than
# by the entrypoint so `docker exec` (backups, check) sees them too.
pg1-socket-path=/var/run/postgresql
