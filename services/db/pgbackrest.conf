# pgBackRest configuration for the opengsync production cluster.
#
# Mounted read-only at /etc/pgbackrest/pgbackrest.conf.
#
# The repository is a remote SCP target. pgBackRest connects to the backup
# server over SSH using a key mounted into the container. The SSH host key is
# verified against a known_hosts file, also mounted into the container.
#
# Precedence: command line > environment > this file > default
#
# This file keeps only what an environment variable cannot express:
#   * the stanza name
#   * [global:archive-push] compress-level (command-scoped, not expressible by env)
#
# Repository host, user, and path are configured through environment variables
# (PGBACKREST_REPO1_HOST, PGBACKREST_REPO1_USER, PGBACKREST_REPO1_PATH) in
# compose.yaml / .env.

[global]
# Keep 2 weekly full backups.
repo1-retention-full=2
# Keep WAL for 30 days beyond the oldest retained full backup (~44 days PITR).
repo1-retention-archive=30

# Archive pushes are latency-sensitive (PostgreSQL is waiting on them), so use a
# lighter compression level than backups. Must stay here: it is scoped to this
# command, and env is global.
[global:archive-push]
compress-level=3

[opengsync]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
pg1-socket-path=/var/run/postgresql
