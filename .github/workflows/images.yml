name: Container images

# PRs into main: run tests and build changed images, push nothing.
# Tag v*.*.* (new or force-moved): compare against the previous release tag.
# Changed images are rebuilt and published as :<tag>, :latest and :sha-<short>;
# unchanged images are re-tagged from the previous release without a rebuild,
# so every image exists under every release tag. Tests run only when code
# changed. Pushes to main publish nothing; only a release tag reaches production.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # On a tag with no earlier release tag to compare against, everything counts
    # as changed.
    outputs:
      tests: ${{ steps.filter.outputs.tests == 'true' || steps.previous.outputs.full == 'true' }}
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.previous.outputs.full == 'true' }}
      worker: ${{ steps.filter.outputs.worker == 'true' || steps.previous.outputs.full == 'true' }}
      postgres: ${{ steps.filter.outputs.postgres == 'true' || steps.previous.outputs.full == 'true' }}
      migrator: ${{ steps.filter.outputs.migrator == 'true' || steps.previous.outputs.full == 'true' }}
      nginx: ${{ steps.filter.outputs.nginx == 'true' || steps.previous.outputs.full == 'true' }}
      previous: ${{ steps.previous.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # PEP 440 version baked into the images: `2.0.0` on the v2.0.0 tag,
      # `2.0.0.post3+gabc1234` three commits after it.
      - name: Version
        id: version
        run: |
          desc=$(git describe --tags --match 'v*' 2>/dev/null || echo "v0.0.0-0-g${GITHUB_SHA::7}")
          if [[ "$desc" =~ ^v(.+)-([0-9]+)-g([0-9a-f]+)$ ]]; then
            version="${BASH_REMATCH[1]}.post${BASH_REMATCH[2]}+g${BASH_REMATCH[3]}"
          else
            version="${desc#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The nearest earlier release tag on this commit's history. A force-moved
      # tag is excluded by name, so it compares against the release before it.
      - name: Previous release
        id: previous
        if: github.ref_type == 'tag'
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude "$GITHUB_REF_NAME" HEAD 2>/dev/null || true)
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"
          if [ -n "$prev" ]; then
            echo "sha=$(git rev-list -n 1 "$prev")" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Comparing ${GITHUB_REF_NAME} against: ${prev:-<none, building everything>}"
      # PRs diff against the PR base (base/ref are ignored for pull_request);
      # tags diff the previous release's commit against this one, both as SHAs
      # so the action runs a plain `git diff` between them.
      # Each image filter must cover every file its Dockerfile stage copies in:
      # an image whose filter misses a change is re-tagged, not rebuilt.
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request' || steps.previous.outputs.tag != ''
        id: filter
        with:
          base: ${{ steps.previous.outputs.sha }}
          ref: ${{ github.sha }}
          filters: |
            tests:
              - "services/backend/**"
              - "packages/**"
              - "services/db/**"
              - "services/pytest/**"
              - "compose.test.yaml"
              - "uv.lock"
              - "pyproject.toml"
              - ".github/workflows/images.yml"
            backend:
              - "services/backend/**"
              - "packages/**"
              - "docs/*.md"
              - "uv.lock"
              - "pyproject.toml"
              - ".github/workflows/images.yml"
            worker:
              - "services/backend/Dockerfile"
              - "services/backend/pyproject.toml"
              - "packages/**"
              - "uv.lock"
              - "pyproject.toml"
              - ".github/workflows/images.yml"
            postgres:
              - "services/db/Dockerfile"
              - "services/db/entrypoint.sh"
              - "services/db/postgresql.prod.conf"
              - "services/db/pgbackrest.conf"
              - "services/db/init.sh"
              - ".github/workflows/images.yml"
            # Only migrations change what `alembic upgrade head` does; env.py's
            # opengsync_db import is only used by --autogenerate.
            migrator:
              - "services/db/alembic/**"
              - "services/backend/Dockerfile"
              - ".github/workflows/images.yml"
            nginx:
              - "services/nginx/**"
              - "services/backend/static/**"
              - ".github/workflows/images.yml"

  # Runs when code changed since the PR base or the previous release.
  test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run pytest
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from opengsync-pytest
      - name: Tear down
        if: always()
        run: docker compose -f compose.test.yaml down -v

  # Every image job needs a passing (or, when no code changed, skipped) test
  # run, so a failing release tag publishes nothing and :latest never moves for
  # some images but not others. PRs build without pushing.
  publish-backend:
    needs: [changes, test]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=opengsync FastAPI backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/backend/Dockerfile
          target: opengsync-app
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.changes.outputs.version }}

  publish-worker:
    needs: [changes, test]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/worker
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=opengsync Taskiq worker and scheduler
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/backend/Dockerfile
          target: celery-worker
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.changes.outputs.version }}

  # Postgres + pgBackRest. The image is validated by building it (pgBackRest
  # is installed and run at build time).
  publish-postgres:
    needs: [changes, test]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/postgres
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=PostgreSQL with pgBackRest for opengsync
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/db/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Nginx reverse proxy: a thin nginx layer with static assets baked in.
  publish-nginx:
    needs: [changes, test]
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/nginx
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=opengsync nginx reverse proxy
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/nginx/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Alembic migrator. Its filter is a subset of the tests filter, so the test
  # suite always runs first; a bad migration is the one artifact that can
  # damage data.
  publish-migrator:
    needs: [changes, test]
    if: >-
      !cancelled()
      && needs.test.result == 'success'
      && needs.changes.outputs.migrator == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/migrator
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=opengsync Alembic migrator
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/backend/Dockerfile
          target: migrator
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.changes.outputs.version }}

  # Points this release tag (and :latest) at the previous release's image for
  # every image that did not change, so compose can pull all of them under
  # ${APP_VERSION}. Runs last and only if nothing failed, so a broken release
  # moves no tags. The re-tagged image still reports the version it was built
  # as, which is the version of its code.
  retag-unchanged:
    needs: [changes, test, publish-backend, publish-worker, publish-postgres, publish-nginx, publish-migrator]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.changes.outputs.previous != ''
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag unchanged images
        env:
          PREVIOUS: ${{ needs.changes.outputs.previous }}
          CHANGED: >-
            backend=${{ needs.changes.outputs.backend }}
            worker=${{ needs.changes.outputs.worker }}
            postgres=${{ needs.changes.outputs.postgres }}
            nginx=${{ needs.changes.outputs.nginx }}
            migrator=${{ needs.changes.outputs.migrator }}
        run: |
          for entry in $CHANGED; do
            name=${entry%%=*}
            if [ "${entry#*=}" = "true" ]; then
              echo "${name}: rebuilt"
              continue
            fi
            image="ghcr.io/${{ github.repository }}/${name}"
            echo "${name}: unchanged, ${image}:${PREVIOUS} -> ${GITHUB_REF_NAME}, latest"
            docker buildx imagetools create \
              --tag "${image}:${GITHUB_REF_NAME}" \
              --tag "${image}:latest" \
              "${image}:${PREVIOUS}"
          done
