[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "opengsync_api"
dynamic = ["version"]
description = "Python API for NGS sample/library/project tracking app."
authors = [
    { name = "lutrarutra", email = "lutrarutra@pm.me" }
]
requires-python = ">=3.11"
dependencies = [
    "opengsync-db",
    "requests"
]

[tool.setuptools_scm]
root = "../.."

[project.urls]
Repository = "https://github.com/lutrarutra/opengsync-app"

