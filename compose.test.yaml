services:
    opengsync-pytest:
        container_name: opengsync-pytest
        build:
            context: .
            dockerfile: ./services/backend/Dockerfile
            target: pytest
        command: "pytest tests/ -W always"
        volumes:
            # Host tests overlay the image copy so local edits are picked up without a stale cache.
            - ./services/pytest/tests:/app/tests
            # Host backend code mounted so form/route changes are picked up without rebuilding.
            - ./services/backend/server:/app/services/backend/server
            # Host templates mounted so template changes are picked up without rebuilding.
            - ./services/backend/templates:/templates
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: password
            POSTGRES_DB: test_db
            POSTGRES_PORT: 5434
            POSTGRES_HOST: postgres
            TIMEZONE: "Europe/Vienna"
            TZ: "Europe/Vienna"
            ENVIRONMENT: test
            SECRET_KEY: "test-secret-key-1234-5678-9012-3456"
            REDIS_HOST: redis-cache
            REDIS_PORT: 6379
        depends_on:
            postgres:
                condition: service_healthy
                restart: true
            redis-cache:
                condition: service_healthy
                restart: true

    postgres:
        container_name: opengsync-postgres-db-test
        command: "-c logging_collector=off"
        build:
            context: .
            dockerfile: ./services/db/Dockerfile
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: password
            POSTGRES_DB: test_db
            PGPORT: 5434
            TZ: "Europe/Vienna"
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "test_db", "-U", "admin"]
            interval: 10s
            timeout: 10s
            retries: 5

    redis-cache:
        container_name: opengsync-redis-test
        image: redis:7-alpine
        restart: on-failure
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 10s
            retries: 5
